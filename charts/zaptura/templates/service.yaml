apiVersion: v1
kind: Service
metadata:
  name: {{ include "zaptura.fullname" . }}
  labels:
    {{- include "zaptura.labels" . | nindent 4 }}
    # Marks this Service as the single scrape target. Deliberately NOT in `zaptura.labels`: the
    # headless Service must not carry it, or the ServiceMonitor matches both again. The headless
    # Service exists for StatefulSet DNS and sets publishNotReadyAddresses, so scraping it also
    # produces `up=0` for a pod that is still starting.
    zaptura.io/scrape-target: "primary"
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "zaptura.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
